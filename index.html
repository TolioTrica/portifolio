    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #070b14;
            color: #f4f7fb;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        img,
        video {
            max-width: 100%;
        }

        ::selection {
            background: #00d9ff;
            color: #061018;
        }


        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        :root {
            --bg: #070b14;
            --bg-soft: #0d1320;
            --card: rgba(18, 27, 43, 0.72);
            --card-solid: #101827;

            --primary: #00d9ff;
            --primary-dark: #00a8c7;

            --secondary: #7c5cff;

            --text: #f5f7fa;
            --text-soft: #aab4c3;

            --border: rgba(255,255,255,0.09);

            --shadow:
                0 20px 60px rgba(0,0,0,0.35);

            --radius: 22px;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            top: -200px;
            left: -200px;
            background: rgba(0,217,255,0.10);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            right: -250px;
            bottom: -200px;
            background: rgba(124,92,255,0.12);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(7,11,20,0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid transparent;

            transition: 0.3s ease;
        }

        #navbar.scrolled {
            border-bottom: 1px solid var(--border);
            background: rgba(7,11,20,0.92);
        }

        .nav-container {
            width: min(1180px, 92%);
            margin: auto;

            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            list-style: none;

            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            color: var(--text-soft);
            font-size: 0.9rem;
            font-weight: 500;

            position: relative;

            transition: 0.3s ease;
        }

        .nav-link::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -7px;

            width: 0;
            height: 2px;

            background: var(--primary);

            transition: 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }


        /* =========================================================
           HAMBURGER
        ========================================================= */

        .hamburger {
            display: none;
            width: 40px;
            height: 40px;

            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;

            cursor: pointer;

            border-radius: 10px;
        }

        .hamburger .bar {
            width: 23px;
            height: 2px;
            background: white;

            transition: 0.3s ease;
        }

        .hamburger.active .bar:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.active .bar:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active .bar:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }


        /* =========================================================
           GENERAL
        ========================================================= */

        .section {
            width: min(1180px, 92%);
            margin: auto;
            padding: 110px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .section-divider {
            width: 60px;
            height: 4px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );

            border-radius: 10px;

            margin: 15px auto;
        }

        .section-subtitle {
            color: var(--text-soft);
            max-width: 650px;
            margin: 15px auto 0;
        }


        /* =========================================================
           HOME
        ========================================================= */

        .home {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 120px 20px 80px;

            position: relative;
        }

        .home::before {
            content: "";

            position: absolute;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0,217,255,0.12),
                    transparent 65%
                );

            pointer-events: none;
        }

        .home-content {
            position: relative;
            z-index: 2;

            max-width: 900px;
        }

        .home-content h1 {
            font-size: clamp(2.3rem, 7vw, 5rem);
            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -2px;

            margin-bottom: 22px;
        }

        .highlight {
            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    #6ceeff,
                    var(--secondary)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .typing-text {
            color: var(--text-soft);

            font-size: clamp(0.95rem, 2vw, 1.15rem);

            margin-bottom: 35px;
        }

        .home-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            min-height: 48px;

            padding: 12px 24px;

            border-radius: 12px;

            font-weight: 600;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            color: #041016;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #00a8ff
                );

            box-shadow:
                0 10px 30px rgba(0,217,255,0.18);
        }

        .btn-secondary,
        .btn-outline {
            color: white;

            border: 1px solid var(--border);

            background: rgba(255,255,255,0.04);
        }

        .btn-secondary:hover,
        .btn-outline:hover {
            border-color: rgba(0,217,255,0.5);
            background: rgba(0,217,255,0.07);
        }

        .scroll-down {
            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);
        }

        .scroll-down a {
            color: var(--text-soft);

            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(8px);
            }
        }


        /* =========================================================
           ABOUT
        ========================================================= */

        .about-content {
            display: grid;

            grid-template-columns:
                minmax(260px, 380px)
                1fr;

            gap: 70px;

            align-items: center;
        }

        .profile-image-container {
            position: relative;

            max-width: 360px;
            margin: auto;
        }

        .profile-image {
            display: block;

            width: 100%;
            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 28px;

            border: 1px solid var(--border);

            position: relative;
            z-index: 2;

            box-shadow: var(--shadow);
        }

        .image-border-animation {
            position: absolute;

            width: 100%;
            height: 100%;

            top: 18px;
            left: 18px;

            border-radius: 28px;

            border: 1px solid var(--primary);

            opacity: 0.35;
        }

        .about-text {
            color: var(--text-soft);

            margin-bottom: 20px;

            font-size: 1rem;
        }

        .about-cta {
            margin-top: 30px;
        }


        /* =========================================================
           PROJECTS
        ========================================================= */

        .projects-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 25px;
        }

        .project-card {
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            border: 1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);

            border-color:
                rgba(0,217,255,0.25);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);
        }

        .project-media {
            position: relative;

            height: 270px;

            overflow: hidden;

            background: #05080e;
        }

        .project-media video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform 0.5s ease;
        }

        .project-card:hover .project-media video {
            transform: scale(1.04);
        }

        .project-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding: 25px;

            background:
                linear-gradient(
                    to top,
                    rgba(3,7,13,0.96),
                    rgba(3,7,13,0.2),
                    transparent
                );
        }

        .project-overlay h3 {
            font-size: 1.35rem;
            margin-bottom: 12px;
        }

        .tech-tags {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;
        }

        .tech-tags span {
            padding: 5px 9px;

            font-size: 0.72rem;

            border-radius: 7px;

            color: #b9f6ff;

            background: rgba(0,217,255,0.10);

            border: 1px solid rgba(0,217,255,0.15);
        }

        .project-info {
            padding: 22px;
        }

        .project-info p {
            color: var(--text-soft);

            font-size: 0.9rem;

            min-height: 55px;

            margin-bottom: 20px;
        }

        .project-links {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .project-link {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 9px 13px;

            border-radius: 9px;

            font-size: 0.82rem;

            background: rgba(255,255,255,0.04);

            border: 1px solid var(--border);

            transition: 0.3s ease;
        }

        .project-link:hover {
            color: var(--primary);

            border-color:
                rgba(0,217,255,0.35);

            background:
                rgba(0,217,255,0.06);
        }


        /* =========================================================
           SKILLS
        ========================================================= */

        .skills-container {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 25px;
        }

        .skills-category {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 28px;

            backdrop-filter: blur(10px);
        }

        .skills-category h3 {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;

            font-size: 1.05rem;
        }

        .skills-category h3 i {
            color: var(--primary);
        }

        .skill-item {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 20px;
        }

        .skill-item:last-child {
            margin-bottom: 0;
        }

        .skill-icon {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                rgba(0,217,255,0.08);

            color: var(--primary);
        }

        .skill-info {
            flex: 1;
        }

        .skill-info p {
            font-size: 0.85rem;

            margin-bottom: 6px;

            color: #e9eef5;
        }

        .skill-bar {
            width: 100%;
            height: 5px;

            background: rgba(255,255,255,0.07);

            border-radius: 20px;

            overflow: hidden;
        }

        .skill-level {
            height: 100%;

            width: 0;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

            border-radius: inherit;

            transition: width 1.2s ease;
        }


        /* =========================================================
           CONTACT
        ========================================================= */

        .contact-container {
            display: grid;

            grid-template-columns:
                1.1fr
                0.9fr;

            gap: 30px;
        }

        .contact-form-container,
        .contact-info {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 35px;

            backdrop-filter: blur(12px);
        }

        .form-group {
            position: relative;

            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #dbe3ec;

            font-size: 0.85rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            border: 1px solid var(--border);

            background: rgba(0,0,0,0.18);

            color: white;

            border-radius: 11px;

            padding: 13px 45px 13px 15px;

            outline: none;

            transition: 0.3s ease;
        }

        .form-group input {
            height: 50px;
        }

        .form-group textarea {
            min-height: 140px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(0,217,255,0.08);
        }

        .form-group > i {
            position: absolute;

            right: 16px;
            top: 40px;

            color: var(--text-soft);

            pointer-events: none;
        }

        .form-group textarea + i {
            top: 48px;
        }

        .submit-btn {
            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            font-weight: 700;

            color: #031015;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #00a8ff
                );

            transition: 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(0,217,255,0.18);
        }

        .contact-details {
            display: flex;

            flex-direction: column;

            gap: 25px;
        }

            </div>
